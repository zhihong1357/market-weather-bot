name: 市场天气 Bot

on:
  schedule:
    - cron: "7 * * * *"      # 每小时运行一次（第 7 分钟，避开整点高峰）
  workflow_dispatch:         # 允许在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write            # 需要把 state.json 提交回仓库

concurrency:
  group: market-weather
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 运行 bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' }}
        run: python macro_bot.py

      - name: 保存状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "更新状态 [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true
