name: probe
on:
  push:
    branches: [claude/bold-rubin-8vho4p]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python macro_bot.py --dry-run --report
